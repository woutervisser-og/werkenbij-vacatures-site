name: Sollicitaties AVG-bewaartermijn (afgewezen/ingetrokken opruimen)

# Proefdraai (handmatig, "Run workflow" met proefdraai=true) is al een
# paar keer gecontroleerd, daarom nu ook een wekelijkse schedule voor de
# echte opruiming. Maandagnacht, niet op het hele of halve uur (minder
# kans op vertraging bij GitHub's scheduler op drukke momenten).
on:
  workflow_dispatch:
    inputs:
      proefdraai:
        description: "true = alleen tonen wat verwijderd zou worden, niets echt verwijderen"
        type: boolean
        default: true
  schedule:
    - cron: '17 3 * * 1'

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Roep sollicitaties-tick endpoint aan
        run: |
          curl -sS -X POST "https://${{ vars.SITE_URL }}/api/onderhoud/sollicitatiesTick?proefdraai=${{ github.event_name == 'workflow_dispatch' && inputs.proefdraai || 'false' }}" \
            -H "x-tick-secret: ${{ secrets.VACATURES_TICK_SECRET }}" \
            -L --fail
