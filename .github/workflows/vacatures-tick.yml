name: Vacatures automatisch publiceren/sluiten

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Roep vacatures-tick endpoint aan
        run: |
          curl -sS -X POST "${{ vars.SITE_URL }}/api/onderhoud/vacaturesTick" \
            -H "x-tick-secret: ${{ secrets.VACATURES_TICK_SECRET }}" \
            --fail
