<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacatures beheren | OG Clean Fuels</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/beheer/beheer.css">
</head>
<body>

<div class="beheer-topbar">
  <span class="logo">o<span>g</span> clean fuels — beheer</span>
  <span class="beheer-gebruiker" id="gebruiker-info"></span>
</div>

<main class="beheer-main">
  <div class="beheer-header-rij">
    <h1>Vacatures</h1>
    <div style="display:flex; gap:10px;">
      <a href="/beheer/sollicitaties.html" class="btn btn-klein btn-secundair">Sollicitaties</a>
      <a href="/beheer/vacature.html" class="btn btn-klein">+ Nieuwe vacature</a>
    </div>
  </div>

  <div id="melding"></div>

  <div id="vacature-secties"></div>
  <div class="beheer-leeg" id="leeg-status">Vacatures laden...</div>
</main>

<script>
  fetch("/.auth/me")
    .then(r => r.json())
    .then(data => {
      const principal = data.clientPrincipal;
      if (principal) {
        document.getElementById("gebruiker-info").innerHTML =
          `Ingelogd als ${principal.userDetails} <a href="/.auth/logout?post_logout_redirect_uri=/">Uitloggen</a>`;
      }
    })
    .catch(() => {});

  function formatteerDatum(isoDatum) {
    if (!isoDatum) return "—";
    const datum = new Date(isoDatum);
    if (isNaN(datum)) return "—";
    return datum.toLocaleDateString("nl-NL");
  }

  // Vaste volgorde van de status-secties: actief/relevant eerst,
  // gearchiveerd als laatste, eigen sectie (i.p.v. tussen de actieve
  // vacatures door zoals voorheen in 1 platte tabel).
  const STATUS_VOLGORDE = ["gepubliceerd", "ingepland", "concept", "gesloten", "gearchiveerd"];
  const STATUS_LABELS = {
    gepubliceerd: "Gepubliceerd",
    ingepland: "Ingepland",
    concept: "Concept",
    gesloten: "Gesloten",
    gearchiveerd: "Gearchiveerd"
  };
  const KOLOMMEN = [
    { key: "titel", label: "Titel" },
    { key: "afdeling", label: "Afdeling" },
    { key: "sluitingsdatum", label: "Sluitingsdatum" },
    { key: "sollicitaties", label: "Sollicitaties" }
  ];

  let alleVacatures = [];
  let sollicitatieAantallen = {}; // vacatureId -> aantal
  let sorteerKolom = "titel";
  let sorteerRichting = "asc";

  function laadVacatures() {
    Promise.all([
      fetch("/api/vacatures").then(response => {
        if (!response.ok) throw new Error("Status: " + response.status);
        return response.json();
      }),
      // Aantal sollicitaties per vacature: als dit om wat voor reden ook
      // faalt, gewoon zonder tellers verder gaan i.p.v. de hele pagina te
      // laten breken.
      fetch("/api/sollicitatiebeheer")
        .then(response => response.ok ? response.json() : [])
        .catch(() => [])
    ])
      .then(([vacatures, sollicitaties]) => {
        alleVacatures = vacatures;
        sollicitatieAantallen = {};
        (sollicitaties || []).forEach(sollicitatie => {
          if (!sollicitatie.vacatureId) return;
          sollicitatieAantallen[sollicitatie.vacatureId] = (sollicitatieAantallen[sollicitatie.vacatureId] || 0) + 1;
        });
        renderVacatures();
      })
      .catch(error => {
        document.getElementById("leeg-status").textContent =
          "Er ging iets mis bij het laden van de vacatures.";
        console.error(error);
      });
  }

  function maakVergelijker(kolom, richting) {
    const factor = richting === "asc" ? 1 : -1;
    return (a, b) => {
      if (kolom === "sollicitaties") {
        const aantalA = sollicitatieAantallen[a.id] || 0;
        const aantalB = sollicitatieAantallen[b.id] || 0;
        return (aantalA - aantalB) * factor;
      }
      const waardeA = (a[kolom] || "").toLowerCase();
      const waardeB = (b[kolom] || "").toLowerCase();
      return waardeA.localeCompare(waardeB) * factor;
    };
  }

  function renderVacatures() {
    const container = document.getElementById("vacature-secties");
    const leegStatus = document.getElementById("leeg-status");
    container.innerHTML = "";

    if (alleVacatures.length === 0) {
      leegStatus.textContent = "Nog geen vacatures. Klik op '+ Nieuwe vacature' om te beginnen.";
      leegStatus.hidden = false;
      return;
    }
    leegStatus.hidden = true;

    const gesorteerd = [...alleVacatures].sort(maakVergelijker(sorteerKolom, sorteerRichting));

    STATUS_VOLGORDE.forEach(status => {
      const vacaturesInSectie = gesorteerd.filter(v => (v.status || "concept") === status);
      if (vacaturesInSectie.length === 0) return;
      container.appendChild(maakStatusSectie(status, vacaturesInSectie));
    });
  }

  function maakStatusSectie(status, vacatures) {
    const sectie = document.createElement("section");
    sectie.className = "beheer-sectie";

    const kop = document.createElement("h2");
    kop.className = "beheer-sectie-kop";
    kop.textContent = (STATUS_LABELS[status] || status) + " ";
    const aantal = document.createElement("span");
    aantal.className = "beheer-sectie-aantal";
    aantal.textContent = vacatures.length;
    kop.appendChild(aantal);
    sectie.appendChild(kop);

    const wrap = document.createElement("div");
    wrap.className = "beheer-tabel-wrap";
    const tabel = document.createElement("table");
    tabel.className = "beheer-tabel tabel-vacatures";

    const thead = document.createElement("thead");
    const headRij = document.createElement("tr");
    KOLOMMEN.forEach(kolomDef => {
      const th = document.createElement("th");
      th.className = "sorteerbaar";
      th.textContent = kolomDef.label;
      if (sorteerKolom === kolomDef.key) {
        th.textContent += sorteerRichting === "asc" ? " ▲" : " ▼";
        th.classList.add("sorteer-actief");
      }
      th.addEventListener("click", () => {
        if (sorteerKolom === kolomDef.key) {
          sorteerRichting = sorteerRichting === "asc" ? "desc" : "asc";
        } else {
          sorteerKolom = kolomDef.key;
          sorteerRichting = "asc";
        }
        renderVacatures();
      });
      headRij.appendChild(th);
    });
    headRij.appendChild(document.createElement("th"));
    thead.appendChild(headRij);
    tabel.appendChild(thead);

    const tbody = document.createElement("tbody");
    vacatures.forEach(vacature => tbody.appendChild(maakVacatureRij(vacature)));
    tabel.appendChild(tbody);

    wrap.appendChild(tabel);
    sectie.appendChild(wrap);
    return sectie;
  }

  function maakVacatureRij(vacature) {
    const rij = document.createElement("tr");

    const titelCel = document.createElement("td");
    titelCel.textContent = vacature.titel || "(zonder titel)";
    rij.appendChild(titelCel);

    const afdelingCel = document.createElement("td");
    afdelingCel.textContent = vacature.afdeling || "—";
    rij.appendChild(afdelingCel);

    const sluitingCel = document.createElement("td");
    sluitingCel.textContent = formatteerDatum(vacature.sluitingsdatum);
    rij.appendChild(sluitingCel);

    const sollicitatiesCel = document.createElement("td");
    const aantalSollicitaties = sollicitatieAantallen[vacature.id] || 0;
    if (aantalSollicitaties > 0) {
      const link = document.createElement("a");
      link.className = "beheer-sollicitaties-link";
      link.href = "/beheer/sollicitaties.html?vacatureId=" + encodeURIComponent(vacature.id);
      link.textContent = aantalSollicitaties + (aantalSollicitaties === 1 ? " sollicitatie" : " sollicitaties");
      sollicitatiesCel.appendChild(link);
    } else {
      sollicitatiesCel.textContent = "0";
    }
    rij.appendChild(sollicitatiesCel);

    const actiesCel = document.createElement("td");
    actiesCel.className = "acties";

    const bewerkLink = document.createElement("a");
    bewerkLink.className = "btn btn-klein btn-secundair";
    bewerkLink.href = "/beheer/vacature.html?id=" + encodeURIComponent(vacature.id);
    bewerkLink.textContent = "Bewerken";
    actiesCel.appendChild(bewerkLink);

    const verwijderKnop = document.createElement("button");
    verwijderKnop.className = "btn btn-klein btn-gevaar";
    verwijderKnop.textContent = "Verwijderen";
    verwijderKnop.addEventListener("click", () => verwijderVacature(vacature.id, vacature.titel));
    actiesCel.appendChild(verwijderKnop);

    rij.appendChild(actiesCel);
    return rij;
  }

  function toonMelding(tekst, type) {
    const meldingEl = document.getElementById("melding");
    meldingEl.innerHTML = "";
    if (!tekst) return;
    const el = document.createElement("div");
    el.className = "melding melding-" + type;
    el.textContent = tekst;
    meldingEl.appendChild(el);
  }

  function verwijderVacature(id, titel) {
    if (!confirm(`Vacature "${titel || "(zonder titel)"}" definitief verwijderen?`)) return;

    fetch("/api/vacatures/" + encodeURIComponent(id), { method: "DELETE" })
      .then(response => {
        if (!response.ok && response.status !== 204) throw new Error("Status: " + response.status);
        toonMelding("Vacature verwijderd.", "ok");
        laadVacatures();
      })
      .catch(error => {
        toonMelding("Verwijderen is mislukt.", "fout");
        console.error(error);
      });
  }

  laadVacatures();
</script>

</body>
</html>
