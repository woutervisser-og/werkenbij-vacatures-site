<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kandidaatdossier | OG Clean Fuels</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/beheer/beheer.css">
</head>
<body>

<div class="beheer-topbar">
  <div class="beheer-topbar-merk">
    <a href="/beheer/index.html" class="logo" aria-label="OG Clean Fuels beheer, naar het overzicht">
      <span class="logo-afbeelding-wrap">
        <img class="logo-afbeelding logo-afbeelding-kleur" src="/images/logo/og-logo-kleur.png" alt="OG Clean Fuels">
      </span>
    </a>
    <span class="beheer-portal-naam">Working at OG portal</span>
  </div>
  <span class="beheer-gebruiker" id="gebruiker-info"></span>
</div>

<main class="beheer-main">
  <div class="beheer-header-rij">
    <div>
      <h1 id="dossier-naam">Kandidaatdossier</h1>
      <p class="beheer-subtitel" id="dossier-vacature"></p>
    </div>
    <a href="/beheer/sollicitaties.html" class="btn btn-klein btn-secundair">&larr; Terug naar sollicitaties</a>
  </div>

  <div id="melding"></div>

  <div id="dossier-inhoud" hidden>
    <div class="dossier-grid">
      <div class="dossier-kolom-hoofd">
        <section class="dossier-sectie">
          <h2 class="dossier-sectie-kop">Status</h2>
          <div class="dossier-status-rij">
            <select id="status-select"></select>
            <span id="aging-indicator"></span>
          </div>
          <div class="dossier-archiveer-rij">
            <select id="archiveer-select">
              <option value="" selected disabled>Verplaats naar archief...</option>
            </select>
          </div>
        </section>

        <section class="dossier-sectie">
          <h2 class="dossier-sectie-kop">Notities</h2>
          <textarea id="notities-veld" rows="6" placeholder="Interne aantekeningen over deze kandidaat..."></textarea>
          <button type="button" class="btn btn-klein" id="notities-opslaan-knop">Notities opslaan</button>
        </section>

        <section class="dossier-sectie">
          <h2 class="dossier-sectie-kop">Tijdlijn</h2>
          <div id="tijdlijn"></div>
        </section>
      </div>

      <div class="dossier-kolom-zijkant">
        <section class="dossier-sectie">
          <h2 class="dossier-sectie-kop">Contact</h2>
          <p id="dossier-email"></p>
          <p id="dossier-telefoon"></p>
        </section>

        <section class="dossier-sectie">
          <h2 class="dossier-sectie-kop">Motivatie</h2>
          <p id="dossier-motivatie" class="dossier-motivatie"></p>
        </section>

        <section class="dossier-sectie">
          <h2 class="dossier-sectie-kop">Documenten</h2>
          <div class="bijlagen-links" id="dossier-bijlagen"></div>
        </section>

        <section class="dossier-sectie">
          <button type="button" class="btn btn-klein btn-gevaar" id="verwijder-knop">Sollicitatie verwijderen</button>
        </section>
      </div>
    </div>
  </div>

  <div class="beheer-leeg" id="leeg-status">Dossier laden...</div>
</main>

<script>
  const BORD_FASES = ["nieuw", "screening", "eerste_gesprek", "tweede_gesprek", "aanbod", "aangenomen"];
  const EXIT_STATUSSEN = ["afgewezen", "ingetrokken"];
  const ALLE_STATUSSEN = [...BORD_FASES, ...EXIT_STATUSSEN];
  const FASE_LABELS = {
    nieuw: "Nieuw",
    screening: "Screening",
    eerste_gesprek: "Eerste gesprek",
    tweede_gesprek: "Tweede gesprek",
    aanbod: "Aanbod",
    aangenomen: "Aangenomen",
    afgewezen: "Afgewezen",
    ingetrokken: "Ingetrokken door kandidaat"
  };

  const zoekParams = new URLSearchParams(location.search);
  const sollicitatieId = zoekParams.get("id");

  fetch("/.auth/me")
    .then(r => r.json())
    .then(data => {
      const principal = data.clientPrincipal;
      if (principal) {
        document.getElementById("gebruiker-info").innerHTML =
          `Ingelogd als ${principal.userDetails} <a href="/.auth/logout?post_logout_redirect_uri=/">Uitloggen</a>`;
      }
    })
    .catch(() => {});

  function toonMelding(tekst, type) {
    const meldingEl = document.getElementById("melding");
    meldingEl.innerHTML = "";
    if (!tekst) return;
    const el = document.createElement("div");
    el.className = "melding melding-" + type;
    el.textContent = tekst;
    meldingEl.appendChild(el);
  }

  function formatteerDatum(isoDatum) {
    if (!isoDatum) return "—";
    const datum = new Date(isoDatum);
    if (isNaN(datum)) return "—";
    return datum.toLocaleDateString("nl-NL", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }

  function dagenSinds(isoTimestamp) {
    if (!isoTimestamp) return null;
    const toen = new Date(isoTimestamp).getTime();
    if (isNaN(toen)) return null;
    return Math.floor((Date.now() - toen) / (1000 * 60 * 60 * 24));
  }
  function agingKlasse(dagen) {
    if (dagen === null) return "aging-onbekend";
    if (dagen < 3) return "aging-groen";
    if (dagen <= 7) return "aging-oranje";
    return "aging-rood";
  }
  function agingTekst(dagen) {
    if (dagen === null) return "—";
    if (dagen === 0) return "Vandaag gewijzigd";
    if (dagen === 1) return "1 dag geleden gewijzigd";
    return `${dagen} dagen geleden gewijzigd`;
  }

  if (!sollicitatieId) {
    document.getElementById("leeg-status").textContent = "Geen kandidaat opgegeven.";
  } else {
    laadDossier();
  }

  function laadDossier() {
    fetch("/api/sollicitatiebeheer")
      .then(response => {
        if (!response.ok) throw new Error("Status: " + response.status);
        return response.json();
      })
      .then(sollicitaties => {
        const sollicitatie = sollicitaties.find(s => s.id === sollicitatieId);
        if (!sollicitatie) {
          document.getElementById("leeg-status").textContent = "Deze sollicitatie is niet gevonden (mogelijk verwijderd).";
          return;
        }
        toonDossier(sollicitatie);
      })
      .catch(error => {
        document.getElementById("leeg-status").textContent = "Er ging iets mis bij het laden van dit dossier.";
        console.error(error);
      });
  }

  function toonDossier(sollicitatie) {
    document.getElementById("leeg-status").hidden = true;
    document.getElementById("dossier-inhoud").hidden = false;

    const volledigeNaam = `${sollicitatie.voornaam || ""} ${sollicitatie.achternaam || ""}`.trim() || "(onbekend)";
    document.getElementById("dossier-naam").textContent = volledigeNaam;
    document.getElementById("dossier-vacature").textContent = sollicitatie.vacatureTitel
      ? `Sollicitatie voor: ${sollicitatie.vacatureTitel}`
      : "Vacature onbekend";

    document.getElementById("dossier-email").innerHTML =
      `✉ <a href="mailto:${sollicitatie.email || ""}">${sollicitatie.email || "—"}</a>`;
    document.getElementById("dossier-telefoon").textContent = sollicitatie.telefoon
      ? `☎ ${sollicitatie.telefoon}`
      : "Geen telefoonnummer opgegeven";

    document.getElementById("dossier-motivatie").textContent = sollicitatie.motivatie || "Geen motivatie meegegeven.";

    const bijlagenWrap = document.getElementById("dossier-bijlagen");
    bijlagenWrap.innerHTML = "";
    const cvLink = document.createElement("a");
    cvLink.className = "btn btn-klein btn-secundair";
    cvLink.href = "/api/sollicitatiebeheer/" + encodeURIComponent(sollicitatie.id) + "/bijlage?veld=cv";
    cvLink.textContent = "CV downloaden";
    bijlagenWrap.appendChild(cvLink);
    if (sollicitatie.motivatiebriefNaam) {
      const briefLink = document.createElement("a");
      briefLink.className = "btn btn-klein btn-secundair";
      briefLink.href = "/api/sollicitatiebeheer/" + encodeURIComponent(sollicitatie.id) + "/bijlage?veld=motivatiebrief";
      briefLink.textContent = "Motivatiebrief downloaden";
      bijlagenWrap.appendChild(briefLink);
    }

    const statusSelect = document.getElementById("status-select");
    statusSelect.innerHTML = "";
    ALLE_STATUSSEN.forEach(status => {
      const optie = document.createElement("option");
      optie.value = status;
      optie.textContent = FASE_LABELS[status];
      if (status === sollicitatie.status) optie.selected = true;
      statusSelect.appendChild(optie);
    });
    statusSelect.onchange = () => wijzigStatus(sollicitatie.id, statusSelect.value);

    const archiveerSelect = document.getElementById("archiveer-select");
    archiveerSelect.innerHTML = `<option value="" selected disabled>Verplaats naar archief...</option>` +
      EXIT_STATUSSEN.map(status => `<option value="${status}">${FASE_LABELS[status]}</option>`).join("");
    archiveerSelect.onchange = () => { if (archiveerSelect.value) wijzigStatus(sollicitatie.id, archiveerSelect.value); };

    const history = sollicitatie.statusHistory || [];
    const laatsteTijdstip = history.length ? history[history.length - 1].timestamp : sollicitatie.ingediendOp;
    const dagen = dagenSinds(laatsteTijdstip);
    const agingEl = document.getElementById("aging-indicator");
    agingEl.className = "aging";
    agingEl.innerHTML = `<span class="aging-dot ${agingKlasse(dagen)}"></span> ${agingTekst(dagen)}`;

    document.getElementById("notities-veld").value = sollicitatie.notities || "";
    document.getElementById("notities-opslaan-knop").onclick = () => opslaanNotities(sollicitatie.id);

    renderTijdlijn(history, sollicitatie.ingediendOp);

    document.getElementById("verwijder-knop").onclick = () => verwijderSollicitatie(sollicitatie.id, volledigeNaam);
  }

  function renderTijdlijn(history, ingediendOp) {
    const container = document.getElementById("tijdlijn");
    container.innerHTML = "";
    if (!history.length) {
      container.innerHTML = `<p class="blokken-leeg">Nog geen tijdlijn beschikbaar.</p>`;
      return;
    }
    // Nieuwste eerst, als een activiteiten-feed.
    [...history].reverse().forEach(entry => {
      const item = document.createElement("div");
      item.className = "tijdlijn-item";

      const stip = document.createElement("span");
      stip.className = "tijdlijn-stip";
      item.appendChild(stip);

      const inhoud = document.createElement("div");
      inhoud.className = "tijdlijn-inhoud";
      const omschrijving = entry.from
        ? `${FASE_LABELS[entry.from] || entry.from} → ${FASE_LABELS[entry.to] || entry.to}`
        : `Sollicitatie ingediend (${FASE_LABELS[entry.to] || entry.to})`;
      inhoud.innerHTML = `<strong>${omschrijving}</strong><br>` +
        `<span class="tijdlijn-meta">${formatteerDatum(entry.timestamp)} &middot; door ${entry.user || "onbekend"}</span>`;
      item.appendChild(inhoud);

      container.appendChild(item);
    });
  }

  function wijzigStatus(id, status) {
    fetch("/api/sollicitatiebeheer/" + encodeURIComponent(id), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status })
    })
      .then(response => {
        if (!response.ok) throw new Error("Status: " + response.status);
        toonMelding("Status bijgewerkt.", "ok");
        laadDossier();
      })
      .catch(error => {
        toonMelding("Status bijwerken is mislukt.", "fout");
        console.error(error);
      });
  }

  function opslaanNotities(id) {
    const notities = document.getElementById("notities-veld").value;
    fetch("/api/sollicitatiebeheer/" + encodeURIComponent(id), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ notities })
    })
      .then(response => {
        if (!response.ok) throw new Error("Status: " + response.status);
        toonMelding("Notities opgeslagen.", "ok");
      })
      .catch(error => {
        toonMelding("Notities opslaan is mislukt.", "fout");
        console.error(error);
      });
  }

  function verwijderSollicitatie(id, naam) {
    if (!confirm(`Sollicitatie van "${naam}" definitief verwijderen?`)) return;

    fetch("/api/sollicitatiebeheer/" + encodeURIComponent(id), { method: "DELETE" })
      .then(response => {
        if (!response.ok && response.status !== 204) throw new Error("Status: " + response.status);
        location.href = "/beheer/sollicitaties.html";
      })
      .catch(error => {
        toonMelding("Verwijderen is mislukt.", "fout");
        console.error(error);
      });
  }
</script>

</body>
</html>
