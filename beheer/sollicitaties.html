<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sollicitaties beheren | OG Clean Fuels</title>
<link rel="icon" href="/images/favicon-og.ico">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/beheer/beheer.css">
</head>
<body>

<div class="beheer-topbar">
  <div class="beheer-topbar-merk">
    <a href="/beheer/index.html" class="logo" aria-label="OG Clean Fuels beheer, naar het overzicht">
      <span class="logo-afbeelding-wrap">
        <img class="logo-afbeelding logo-afbeelding-kleur" src="/images/logo/og-logo-kleur.png" alt="OG Clean Fuels">
      </span>
    </a>
    <span class="beheer-portal-naam">Working at OG portal</span>
  </div>
  <span class="beheer-gebruiker" id="gebruiker-info"></span>
</div>

<main class="beheer-main beheer-main-breed">
  <div class="beheer-header-rij">
    <div>
      <h1>Sollicitaties</h1>
      <p class="beheer-subtitel" id="filter-context" hidden></p>
    </div>
    <a href="/beheer/index.html" class="btn btn-klein btn-secundair">&larr; Terug naar vacatures</a>
  </div>

  <div id="melding"></div>

  <div class="sollicitatie-filters">
    <div class="form-veld">
      <label for="filter-vacature">Vacature</label>
      <select id="filter-vacature"><option value="">Alle vacatures</option></select>
    </div>
    <div class="form-veld">
      <label for="filter-fase">Fase</label>
      <select id="filter-fase"><option value="">Alle fases</option></select>
    </div>
    <div class="form-veld">
      <label for="filter-min-dagen">Langer dan (dagen) in huidige fase</label>
      <input type="number" id="filter-min-dagen" min="0" placeholder="bv. 7">
    </div>
    <div class="form-veld sollicitatie-filter-zoek">
      <label for="filter-zoek">Zoek op naam</label>
      <input type="text" id="filter-zoek" placeholder="Naam kandidaat...">
    </div>
  </div>

  <div class="weergave-toggle">
    <button type="button" class="weergave-knop" data-weergave="bord">Bord</button>
    <button type="button" class="weergave-knop" data-weergave="lijst">Lijst</button>
    <button type="button" class="weergave-knop" data-weergave="afgewezen">Afgewezen</button>
    <button type="button" class="weergave-knop" data-weergave="archief">Archief</button>
  </div>

  <div id="kanban-bord" class="kanban-bord" hidden></div>

  <div id="lijst-weergave" class="beheer-tabel-wrap" hidden>
    <table class="beheer-tabel" id="lijst-tabel">
      <thead><tr id="lijst-tabel-kop"></tr></thead>
      <tbody id="lijst-tabel-body"></tbody>
    </table>
  </div>

  <div id="afgewezen-weergave" class="beheer-tabel-wrap" hidden>
    <table class="beheer-tabel">
      <thead>
        <tr>
          <th>Naam</th>
          <th>Vacature</th>
          <th>Afgewezen op</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="afgewezen-tabel-body"></tbody>
    </table>
  </div>

  <div id="archief-weergave" class="beheer-tabel-wrap" hidden>
    <table class="beheer-tabel">
      <thead>
        <tr>
          <th>Naam</th>
          <th>Vacature</th>
          <th>Gearchiveerd op</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="archief-tabel-body"></tbody>
    </table>
  </div>

  <div class="beheer-leeg" id="leeg-status">Sollicitaties laden...</div>
</main>

<script>
  // Zelfde 8 statussen als ALLOWED_STATUSSEN in api/shared/sollicitatiesTable.js:
  // 6 fases op volgorde (het kanban-bord) + 2 exit-statussen (afgewezen/
  // ingetrokken), elk met een eigen lijst (zie "Afgewezen"/"Archief"
  // hieronder), bereikbaar vanuit elke fase, geen bordkolom.
  const BORD_FASES = ["nieuw", "screening", "eerste_gesprek", "tweede_gesprek", "aanbod", "aangenomen"];
  const FASE_LABELS = {
    nieuw: "Nieuw",
    screening: "Screening",
    eerste_gesprek: "Eerste gesprek",
    tweede_gesprek: "Tweede gesprek",
    aanbod: "Aanbod",
    aangenomen: "Aangenomen",
    afgewezen: "Afgewezen",
    ingetrokken: "Ingetrokken door kandidaat"
  };

  // Vanuit het vacature-overzicht kan hierheen doorgeklikt worden met
  // ?vacatureId=..., zodat de vacature-filter meteen op die vacature staat
  // i.p.v. de volledige, ongefilterde lijst.
  const zoekParams = new URLSearchParams(location.search);
  const vacatureIdUitUrl = zoekParams.get("vacatureId");

  let alleSollicitaties = [];
  let huidigeWeergave = "bord";
  const filters = { vacatureId: vacatureIdUitUrl || "", fase: "", minDagen: "", zoek: "" };
  let sorteerKolom = "ingediendOp";
  let sorteerRichting = "desc";

  function toonFilterContext(titel) {
    const el = document.getElementById("filter-context");
    if (!vacatureIdUitUrl) {
      el.hidden = true;
      return;
    }
    el.innerHTML = `Gefilterd op vacature: <strong>${titel || "(onbekende vacature)"}</strong> &middot; ` +
      `<a href="/beheer/sollicitaties.html">alle sollicitaties tonen</a>`;
    el.hidden = false;
  }

  fetch("/.auth/me")
    .then(r => r.json())
    .then(data => {
      const principal = data.clientPrincipal;
      if (principal) {
        document.getElementById("gebruiker-info").innerHTML =
          `Ingelogd als ${principal.userDetails} <a href="/.auth/logout?post_logout_redirect_uri=/">Uitloggen</a>`;
      }
    })
    .catch(() => {});

  function toonMelding(tekst, type) {
    const meldingEl = document.getElementById("melding");
    meldingEl.innerHTML = "";
    if (!tekst) return;
    const el = document.createElement("div");
    el.className = "melding melding-" + type;
    el.textContent = tekst;
    meldingEl.appendChild(el);
  }

  function formatteerDatum(isoDatum) {
    if (!isoDatum) return "—";
    const datum = new Date(isoDatum);
    if (isNaN(datum)) return "—";
    return datum.toLocaleDateString("nl-NL", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }

  // ===== Aging: tijd sinds de laatste statuswijziging (of, als er nog
  // geen wijziging is geweest, sinds het indienen zelf) =====
  function laatsteWijzigingTijdstip(sollicitatie) {
    const history = sollicitatie.statusHistory || [];
    if (history.length > 0) return history[history.length - 1].timestamp;
    return sollicitatie.ingediendOp;
  }
  function dagenSinds(isoTimestamp) {
    if (!isoTimestamp) return null;
    const toen = new Date(isoTimestamp).getTime();
    if (isNaN(toen)) return null;
    return Math.floor((Date.now() - toen) / (1000 * 60 * 60 * 24));
  }
  function agingKlasse(dagen) {
    if (dagen === null) return "aging-onbekend";
    if (dagen < 3) return "aging-groen";
    if (dagen <= 7) return "aging-oranje";
    return "aging-rood";
  }
  function agingTekst(dagen) {
    if (dagen === null) return "—";
    if (dagen === 0) return "Vandaag";
    if (dagen === 1) return "1 dag geleden";
    return `${dagen} dagen geleden`;
  }
  function maakAgingEl(sollicitatie) {
    const dagen = dagenSinds(laatsteWijzigingTijdstip(sollicitatie));
    const wrap = document.createElement("span");
    wrap.className = "aging";
    const dot = document.createElement("span");
    dot.className = "aging-dot " + agingKlasse(dagen);
    wrap.appendChild(dot);
    wrap.appendChild(document.createTextNode(agingTekst(dagen)));
    return wrap;
  }

  function laadSollicitaties() {
    fetch("/api/sollicitatiebeheer")
      .then(response => {
        if (!response.ok) throw new Error("Status: " + response.status);
        return response.json();
      })
      .then(sollicitaties => {
        alleSollicitaties = sollicitaties;
        vulVacatureFilterIn();
        if (vacatureIdUitUrl) {
          const match = sollicitaties.find(s => s.vacatureId === vacatureIdUitUrl);
          toonFilterContext(match && match.vacatureTitel);
        }
        renderAlles();
      })
      .catch(error => {
        document.getElementById("leeg-status").textContent =
          "Er ging iets mis bij het laden van de sollicitaties.";
        document.getElementById("leeg-status").hidden = false;
        console.error(error);
      });
  }

  function vulVacatureFilterIn() {
    const select = document.getElementById("filter-vacature");
    const huidigeWaarde = select.value || filters.vacatureId;
    const gezien = new Map();
    alleSollicitaties.forEach(s => {
      if (s.vacatureId && !gezien.has(s.vacatureId)) gezien.set(s.vacatureId, s.vacatureTitel || "(onbekend)");
    });
    select.innerHTML = '<option value="">Alle vacatures</option>';
    [...gezien.entries()].sort((a, b) => a[1].localeCompare(b[1])).forEach(([id, titel]) => {
      const optie = document.createElement("option");
      optie.value = id;
      optie.textContent = titel;
      select.appendChild(optie);
    });
    select.value = huidigeWaarde;
  }

  // Fase-filter en "fase"-select in de lijst-weergave gebruiken alleen de
  // 6 bordfases, niet de exit-statussen (die zijn nooit een gewone
  // volgende stap om naartoe te filteren/verplaatsen).
  const filterFaseSelect = document.getElementById("filter-fase");
  BORD_FASES.forEach(fase => {
    const optie = document.createElement("option");
    optie.value = fase;
    optie.textContent = FASE_LABELS[fase];
    filterFaseSelect.appendChild(optie);
  });

  document.getElementById("filter-vacature").addEventListener("change", e => { filters.vacatureId = e.target.value; renderAlles(); });
  document.getElementById("filter-fase").addEventListener("change", e => { filters.fase = e.target.value; renderAlles(); });
  document.getElementById("filter-min-dagen").addEventListener("input", e => { filters.minDagen = e.target.value; renderAlles(); });
  document.getElementById("filter-zoek").addEventListener("input", e => { filters.zoek = e.target.value; renderAlles(); });

  document.querySelectorAll(".weergave-knop").forEach(knop => {
    knop.addEventListener("click", () => {
      huidigeWeergave = knop.dataset.weergave;
      document.querySelectorAll(".weergave-knop").forEach(k => k.classList.toggle("weergave-knop-actief", k === knop));
      renderAlles();
    });
  });

  function voldoetAanBasisFilters(sollicitatie) {
    if (filters.vacatureId && sollicitatie.vacatureId !== filters.vacatureId) return false;
    if (filters.zoek) {
      const naam = `${sollicitatie.voornaam || ""} ${sollicitatie.achternaam || ""}`.toLowerCase();
      if (!naam.includes(filters.zoek.toLowerCase())) return false;
    }
    return true;
  }

  function actieveSollicitaties() {
    return alleSollicitaties
      .filter(s => BORD_FASES.includes(s.status))
      .filter(voldoetAanBasisFilters)
      .filter(s => !filters.fase || s.status === filters.fase)
      .filter(s => {
        if (!filters.minDagen) return true;
        const dagen = dagenSinds(laatsteWijzigingTijdstip(s));
        return dagen !== null && dagen >= Number(filters.minDagen);
      });
  }

  // "Afgewezen" en "Archief" zijn nu 2 losse lijsten (1 per exit-status),
  // i.p.v. 1 gecombineerde archiefweergave.
  function sollicitatiesMetStatus(status) {
    return alleSollicitaties
      .filter(s => s.status === status)
      .filter(voldoetAanBasisFilters);
  }

  function renderAlles() {
    document.getElementById("kanban-bord").hidden = huidigeWeergave !== "bord";
    document.getElementById("lijst-weergave").hidden = huidigeWeergave !== "lijst";
    document.getElementById("afgewezen-weergave").hidden = huidigeWeergave !== "afgewezen";
    document.getElementById("archief-weergave").hidden = huidigeWeergave !== "archief";

    if (alleSollicitaties.length === 0) {
      document.getElementById("leeg-status").textContent = vacatureIdUitUrl
        ? "Nog geen sollicitaties voor deze vacature."
        : "Nog geen sollicitaties binnengekomen.";
      document.getElementById("leeg-status").hidden = false;
      return;
    }
    document.getElementById("leeg-status").hidden = true;

    if (huidigeWeergave === "bord") renderBord();
    else if (huidigeWeergave === "lijst") renderLijst();
    else if (huidigeWeergave === "afgewezen") renderAfgewezen();
    else renderArchief();
  }

  // ===== Bord-weergave =====
  function renderBord() {
    const container = document.getElementById("kanban-bord");
    container.innerHTML = "";
    const sollicitaties = actieveSollicitaties();

    BORD_FASES.forEach(fase => {
      const kaartenInFase = sollicitaties.filter(s => s.status === fase);
      container.appendChild(maakKanbanKolom(fase, kaartenInFase));
    });
  }

  function maakKanbanKolom(fase, kaarten) {
    const kolom = document.createElement("div");
    kolom.className = "kanban-kolom";
    kolom.dataset.fase = fase;

    const kop = document.createElement("div");
    kop.className = "kanban-kolom-kop";
    kop.innerHTML = `${FASE_LABELS[fase]} <span class="beheer-sectie-aantal">${kaarten.length}</span>`;
    kolom.appendChild(kop);

    const lijst = document.createElement("div");
    lijst.className = "kanban-kaarten";
    kaarten
      .sort((a, b) => (b.ingediendOp || "").localeCompare(a.ingediendOp || ""))
      .forEach(sollicitatie => lijst.appendChild(maakKanbanKaart(sollicitatie)));
    kolom.appendChild(lijst);

    kolom.addEventListener("dragover", event => {
      event.preventDefault();
      kolom.classList.add("kanban-kolom-dragover");
    });
    kolom.addEventListener("dragleave", () => kolom.classList.remove("kanban-kolom-dragover"));
    kolom.addEventListener("drop", event => {
      event.preventDefault();
      kolom.classList.remove("kanban-kolom-dragover");
      const id = event.dataTransfer.getData("text/plain");
      const sollicitatie = alleSollicitaties.find(s => s.id === id);
      if (sollicitatie && sollicitatie.status !== fase) wijzigStatus(id, fase);
    });

    return kolom;
  }

  // 2 kleine knoppen i.p.v. een dropdown: direct naar 1 van de 2
  // exit-statussen, elk met een eigen lijst (zie hieronder).
  function maakKaartActies(id) {
    const wrap = document.createElement("div");
    wrap.className = "kaart-acties";

    const afwijzenKnop = document.createElement("button");
    afwijzenKnop.type = "button";
    afwijzenKnop.className = "kaart-actie-knop";
    afwijzenKnop.textContent = "Afgewezen";
    afwijzenKnop.addEventListener("click", event => {
      event.stopPropagation();
      wijzigStatus(id, "afgewezen");
    });
    wrap.appendChild(afwijzenKnop);

    const archiveerKnop = document.createElement("button");
    archiveerKnop.type = "button";
    archiveerKnop.className = "kaart-actie-knop";
    archiveerKnop.textContent = "Archiveren";
    archiveerKnop.addEventListener("click", event => {
      event.stopPropagation();
      wijzigStatus(id, "ingetrokken");
    });
    wrap.appendChild(archiveerKnop);

    return wrap;
  }

  function maakKanbanKaart(sollicitatie) {
    const kaart = document.createElement("div");
    kaart.className = "kanban-kaart";
    kaart.draggable = true;
    kaart.dataset.id = sollicitatie.id;

    kaart.addEventListener("dragstart", event => {
      event.dataTransfer.setData("text/plain", sollicitatie.id);
      kaart.classList.add("kanban-kaart-slepend");
    });
    kaart.addEventListener("dragend", () => kaart.classList.remove("kanban-kaart-slepend"));
    kaart.addEventListener("click", event => {
      if (event.target.closest(".kaart-acties")) return;
      location.href = "/beheer/sollicitatie-dossier.html?id=" + encodeURIComponent(sollicitatie.id);
    });

    const naam = document.createElement("div");
    naam.className = "kanban-kaart-naam";
    naam.textContent = `${sollicitatie.voornaam || ""} ${sollicitatie.achternaam || ""}`.trim() || "(onbekend)";
    kaart.appendChild(naam);

    const vacature = document.createElement("div");
    vacature.className = "kanban-kaart-vacature";
    vacature.textContent = sollicitatie.vacatureTitel || "—";
    kaart.appendChild(vacature);

    const metaRij = document.createElement("div");
    metaRij.className = "kanban-kaart-meta";
    metaRij.appendChild(maakAgingEl(sollicitatie));
    kaart.appendChild(metaRij);

    kaart.appendChild(maakKaartActies(sollicitatie.id));

    return kaart;
  }

  // ===== Lijst-weergave =====
  const LIJST_KOLOMMEN = [
    { key: "naam", label: "Naam" },
    { key: "vacatureTitel", label: "Vacature" },
    { key: "status", label: "Fase" },
    { key: "ingediendOp", label: "Binnengekomen" },
    { key: "aging", label: "Laatste wijziging" }
  ];

  function vergelijkswaarde(sollicitatie, kolom) {
    if (kolom === "naam") return `${sollicitatie.voornaam || ""} ${sollicitatie.achternaam || ""}`.trim().toLowerCase();
    if (kolom === "aging") return dagenSinds(laatsteWijzigingTijdstip(sollicitatie)) ?? -1;
    if (kolom === "status") return BORD_FASES.indexOf(sollicitatie.status);
    return (sollicitatie[kolom] || "").toString().toLowerCase();
  }

  function renderLijst() {
    const kopRij = document.getElementById("lijst-tabel-kop");
    kopRij.innerHTML = "";
    LIJST_KOLOMMEN.forEach(kolomDef => {
      const th = document.createElement("th");
      th.className = "sorteerbaar";
      th.textContent = kolomDef.label;
      if (sorteerKolom === kolomDef.key) {
        th.textContent += sorteerRichting === "asc" ? " ▲" : " ▼";
        th.classList.add("sorteer-actief");
      }
      th.addEventListener("click", () => {
        if (sorteerKolom === kolomDef.key) sorteerRichting = sorteerRichting === "asc" ? "desc" : "asc";
        else { sorteerKolom = kolomDef.key; sorteerRichting = "asc"; }
        renderLijst();
      });
      kopRij.appendChild(th);
    });
    kopRij.appendChild(document.createElement("th"));

    const factor = sorteerRichting === "asc" ? 1 : -1;
    const sollicitaties = actieveSollicitaties().sort((a, b) => {
      const waardeA = vergelijkswaarde(a, sorteerKolom);
      const waardeB = vergelijkswaarde(b, sorteerKolom);
      if (typeof waardeA === "number" && typeof waardeB === "number") return (waardeA - waardeB) * factor;
      return String(waardeA).localeCompare(String(waardeB)) * factor;
    });

    const body = document.getElementById("lijst-tabel-body");
    body.innerHTML = "";
    sollicitaties.forEach(sollicitatie => body.appendChild(maakLijstRij(sollicitatie)));
  }

  function maakLijstRij(sollicitatie) {
    const rij = document.createElement("tr");
    rij.className = "sollicitatie-rij-klikbaar";
    rij.addEventListener("click", event => {
      if (event.target.closest("select") || event.target.closest(".kaart-acties")) return;
      location.href = "/beheer/sollicitatie-dossier.html?id=" + encodeURIComponent(sollicitatie.id);
    });

    const naamCel = document.createElement("td");
    naamCel.textContent = `${sollicitatie.voornaam || ""} ${sollicitatie.achternaam || ""}`.trim() || "(onbekend)";
    rij.appendChild(naamCel);

    const vacatureCel = document.createElement("td");
    vacatureCel.textContent = sollicitatie.vacatureTitel || "—";
    rij.appendChild(vacatureCel);

    const faseCel = document.createElement("td");
    const faseSelect = document.createElement("select");
    BORD_FASES.forEach(fase => {
      const optie = document.createElement("option");
      optie.value = fase;
      optie.textContent = FASE_LABELS[fase];
      if (fase === sollicitatie.status) optie.selected = true;
      faseSelect.appendChild(optie);
    });
    faseSelect.addEventListener("change", () => wijzigStatus(sollicitatie.id, faseSelect.value));
    faseCel.appendChild(faseSelect);
    rij.appendChild(faseCel);

    const datumCel = document.createElement("td");
    datumCel.textContent = formatteerDatum(sollicitatie.ingediendOp);
    rij.appendChild(datumCel);

    const agingCel = document.createElement("td");
    agingCel.appendChild(maakAgingEl(sollicitatie));
    rij.appendChild(agingCel);

    const archiefCel = document.createElement("td");
    archiefCel.appendChild(maakKaartActies(sollicitatie.id));
    rij.appendChild(archiefCel);

    return rij;
  }

  // ===== Afgewezen- en archief-weergave =====
  // Elk een losse lijst voor 1 van de 2 exit-statussen, zelfde rij-opzet.
  function renderAfgewezen() {
    const body = document.getElementById("afgewezen-tabel-body");
    body.innerHTML = "";
    sollicitatiesMetStatus("afgewezen")
      .sort((a, b) => (laatsteWijzigingTijdstip(b) || "").localeCompare(laatsteWijzigingTijdstip(a) || ""))
      .forEach(sollicitatie => body.appendChild(maakExitRij(sollicitatie)));
  }

  function renderArchief() {
    const body = document.getElementById("archief-tabel-body");
    body.innerHTML = "";
    sollicitatiesMetStatus("ingetrokken")
      .sort((a, b) => (laatsteWijzigingTijdstip(b) || "").localeCompare(laatsteWijzigingTijdstip(a) || ""))
      .forEach(sollicitatie => body.appendChild(maakExitRij(sollicitatie)));
  }

  function maakExitRij(sollicitatie) {
    const rij = document.createElement("tr");
    rij.className = "sollicitatie-rij-klikbaar";
    rij.addEventListener("click", () => {
      location.href = "/beheer/sollicitatie-dossier.html?id=" + encodeURIComponent(sollicitatie.id);
    });

    const naamCel = document.createElement("td");
    naamCel.textContent = `${sollicitatie.voornaam || ""} ${sollicitatie.achternaam || ""}`.trim() || "(onbekend)";
    rij.appendChild(naamCel);

    const vacatureCel = document.createElement("td");
    vacatureCel.textContent = sollicitatie.vacatureTitel || "—";
    rij.appendChild(vacatureCel);

    const datumCel = document.createElement("td");
    datumCel.textContent = formatteerDatum(laatsteWijzigingTijdstip(sollicitatie));
    rij.appendChild(datumCel);

    const actiesCel = document.createElement("td");
    const verwijderKnop = document.createElement("button");
    verwijderKnop.className = "btn btn-klein btn-gevaar";
    verwijderKnop.textContent = "Verwijderen";
    verwijderKnop.addEventListener("click", event => {
      event.stopPropagation();
      verwijderSollicitatie(sollicitatie.id, naamCel.textContent);
    });
    actiesCel.appendChild(verwijderKnop);
    rij.appendChild(actiesCel);

    return rij;
  }

  // ===== Acties =====
  function wijzigStatus(id, status) {
    fetch("/api/sollicitatiebeheer/" + encodeURIComponent(id), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status })
    })
      .then(response => {
        if (!response.ok) throw new Error("Status: " + response.status);
        return response.json();
      })
      .then(bijgewerkt => {
        const index = alleSollicitaties.findIndex(s => s.id === id);
        if (index !== -1) alleSollicitaties[index] = bijgewerkt;
        toonMelding("Status bijgewerkt.", "ok");
        renderAlles();
      })
      .catch(error => {
        toonMelding("Status bijwerken is mislukt.", "fout");
        console.error(error);
      });
  }

  function verwijderSollicitatie(id, naam) {
    if (!confirm(`Sollicitatie van "${naam}" definitief verwijderen?`)) return;

    fetch("/api/sollicitatiebeheer/" + encodeURIComponent(id), { method: "DELETE" })
      .then(response => {
        if (!response.ok && response.status !== 204) throw new Error("Status: " + response.status);
        toonMelding("Sollicitatie verwijderd.", "ok");
        laadSollicitaties();
      })
      .catch(error => {
        toonMelding("Verwijderen is mislukt.", "fout");
        console.error(error);
      });
  }

  // Standaard-weergave activeren en starten.
  document.querySelector('.weergave-knop[data-weergave="bord"]').classList.add("weergave-knop-actief");
  laadSollicitaties();
</script>

</body>
</html>
