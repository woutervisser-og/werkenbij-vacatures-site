<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacature bewerken | OG Clean Fuels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/beheer/beheer.css">
</head>
<body>

<div class="beheer-topbar">
  <span class="logo">o<span>g</span> clean fuels — beheer</span>
  <span class="beheer-gebruiker" id="gebruiker-info"></span>
</div>

<main class="beheer-main">
  <div class="beheer-header-rij">
    <h1 id="pagina-titel">Nieuwe vacature</h1>
    <a href="/beheer/index.html" class="btn btn-klein btn-secundair">&larr; Terug naar overzicht</a>
  </div>

  <div id="melding"></div>

  <form class="beheer-form" id="vacature-form">
    <div class="form-rij">
      <div class="form-veld volle-breedte">
        <label for="veld-titel">Titel *</label>
        <input type="text" id="veld-titel" required>
      </div>
    </div>

    <div class="form-rij">
      <div class="form-veld">
        <label for="veld-afdeling">Afdeling</label>
        <input type="text" id="veld-afdeling">
      </div>
      <div class="form-veld">
        <label for="veld-locatie">Locatie</label>
        <input type="text" id="veld-locatie">
      </div>
      <div class="form-veld">
        <label for="veld-dienstverband">Uren/dienstverband</label>
        <select id="veld-dienstverband">
          <option value="">Kies...</option>
          <option value="Fulltime">Fulltime</option>
          <option value="Parttime">Parttime</option>
          <option value="Stage">Stage</option>
          <option value="Overig">Overig</option>
        </select>
      </div>
      <div class="form-veld">
        <label for="veld-opleidingsniveau">Opleidingsniveau</label>
        <select id="veld-opleidingsniveau">
          <option value="">Kies...</option>
          <option value="MBO">MBO</option>
          <option value="HBO">HBO</option>
          <option value="WO">WO</option>
          <option value="Geen vereiste">Geen vereiste</option>
        </select>
      </div>
    </div>

    <div class="form-rij">
      <div class="form-veld form-veld-checkbox volle-breedte">
        <input type="checkbox" id="veld-salaris-overleg">
        <label for="veld-salaris-overleg" style="font-weight: 600;">Salaris in overleg</label>
      </div>
      <div class="form-veld">
        <label for="veld-salaris-min">Salaris (min, per maand)</label>
        <input type="number" id="veld-salaris-min" min="0">
      </div>
      <div class="form-veld">
        <label for="veld-salaris-max">Salaris (max, per maand)</label>
        <input type="number" id="veld-salaris-max" min="0">
      </div>
      <div class="form-veld">
        <label for="veld-publicatiedatum">Publicatiedatum</label>
        <input type="date" id="veld-publicatiedatum">
      </div>
      <div class="form-veld">
        <label for="veld-sluitingsdatum">Sluitingsdatum</label>
        <input type="date" id="veld-sluitingsdatum">
      </div>
    </div>

    <div class="form-rij">
      <div class="form-veld">
        <label for="veld-status">Status</label>
        <select id="veld-status">
          <option value="concept">Concept</option>
          <option value="ingepland">Ingepland</option>
          <option value="gepubliceerd">Gepubliceerd</option>
          <option value="gesloten">Gesloten</option>
          <option value="gearchiveerd">Gearchiveerd</option>
        </select>
      </div>
    </div>

    <fieldset class="header-keuze">
      <legend>Header</legend>
      <div class="header-type-opties">
        <label><input type="radio" name="header-type" value="foto" id="header-type-foto" checked> Foto</label>
        <label><input type="radio" name="header-type" value="video" id="header-type-video"> Video</label>
      </div>

      <div id="header-foto-opties">
        <img id="header-preview" class="header-preview" hidden>
        <div class="form-rij" style="margin-bottom: 10px;">
          <div class="form-veld">
            <label for="veld-foto-upload">Nieuwe foto uploaden</label>
            <input type="file" id="veld-foto-upload" accept=".jpg,.jpeg,.png,.webp,.gif">
          </div>
          <div class="form-veld">
            <label>&nbsp;</label>
            <button type="button" class="btn btn-klein btn-secundair" id="toon-mediabibliotheek">Bestaande foto kiezen</button>
          </div>
        </div>
        <div class="media-grid" id="media-grid" hidden></div>
      </div>

      <div id="header-video-opties" hidden>
        <div class="form-veld volle-breedte">
          <label for="veld-video-url">Video-URL (bv. YouTube embed-link)</label>
          <input type="url" id="veld-video-url" placeholder="https://youtube.com/embed/...">
        </div>
      </div>
    </fieldset>

    <fieldset class="header-keuze">
      <legend>Inhoud (body-blokken)</legend>
      <div class="blok-toevoegen-rij">
        <select id="nieuw-blok-type"></select>
        <button type="button" class="btn btn-klein btn-secundair" id="blok-toevoegen-knop">+ Blok toevoegen</button>
      </div>
      <div id="blokken-container"></div>
    </fieldset>

    <div class="form-acties">
      <button type="submit" class="btn btn-klein" id="opslaan-knop">Opslaan</button>
      <button type="button" class="btn btn-klein btn-gevaar" id="verwijder-knop" hidden>Verwijderen</button>
    </div>
  </form>
</main>

<script>
  const zoekParams = new URLSearchParams(location.search);
  const vacatureId = zoekParams.get("id");
  let headerBron = "";

  fetch("/.auth/me")
    .then(r => r.json())
    .then(data => {
      const principal = data.clientPrincipal;
      if (principal) {
        document.getElementById("gebruiker-info").innerHTML =
          `Ingelogd als ${principal.userDetails} <a href="/.auth/logout?post_logout_redirect_uri=/">Uitloggen</a>`;
      }
    })
    .catch(() => {});

  function toonMelding(tekst, type) {
    const meldingEl = document.getElementById("melding");
    meldingEl.innerHTML = "";
    if (!tekst) return;
    const el = document.createElement("div");
    el.className = "melding melding-" + type;
    el.textContent = tekst;
    meldingEl.appendChild(el);
  }

  function toonHeaderPreview(url) {
    const preview = document.getElementById("header-preview");
    if (url) {
      preview.src = url;
      preview.hidden = false;
    } else {
      preview.hidden = true;
    }
  }

  function stelHeaderTypeIn(type) {
    document.getElementById("header-type-foto").checked = type !== "video";
    document.getElementById("header-type-video").checked = type === "video";
    document.getElementById("header-foto-opties").hidden = type === "video";
    document.getElementById("header-video-opties").hidden = type !== "video";
  }

  document.getElementById("header-type-foto").addEventListener("change", () => stelHeaderTypeIn("foto"));
  document.getElementById("header-type-video").addEventListener("change", () => stelHeaderTypeIn("video"));

  document.getElementById("veld-salaris-overleg").addEventListener("change", event => {
    const uitgeschakeld = event.target.checked;
    document.getElementById("veld-salaris-min").disabled = uitgeschakeld;
    document.getElementById("veld-salaris-max").disabled = uitgeschakeld;
  });

  // ===== Mediabibliotheek: bestaande foto kiezen =====
  document.getElementById("toon-mediabibliotheek").addEventListener("click", () => {
    const grid = document.getElementById("media-grid");
    if (!grid.hidden) {
      grid.hidden = true;
      return;
    }
    grid.hidden = false;
    grid.innerHTML = "<p>Bibliotheek laden...</p>";

    fetch("/api/media")
      .then(response => {
        if (!response.ok) throw new Error("Status: " + response.status);
        return response.json();
      })
      .then(bestanden => {
        grid.innerHTML = "";
        if (bestanden.length === 0) {
          grid.innerHTML = "<p>Nog geen foto's geüpload.</p>";
          return;
        }
        bestanden.forEach(bestand => {
          const knop = document.createElement("button");
          knop.type = "button";
          knop.title = bestand.naam;
          const img = document.createElement("img");
          img.src = bestand.url;
          img.alt = bestand.naam;
          knop.appendChild(img);
          knop.addEventListener("click", () => {
            headerBron = bestand.url;
            toonHeaderPreview(bestand.url);
            grid.hidden = true;
          });
          grid.appendChild(knop);
        });
      })
      .catch(error => {
        grid.innerHTML = "<p>Kon de mediabibliotheek niet laden.</p>";
        console.error(error);
      });
  });

  // ===== Nieuwe foto uploaden =====
  document.getElementById("veld-foto-upload").addEventListener("change", event => {
    const bestand = event.target.files[0];
    if (!bestand) return;

    toonMelding("Foto wordt geüpload...", "ok");
    fetch("/api/media?bestandsnaam=" + encodeURIComponent(bestand.name), {
      method: "POST",
      headers: { "Content-Type": "application/octet-stream" },
      body: bestand
    })
      .then(response => {
        if (!response.ok) throw new Error("Status: " + response.status);
        return response.json();
      })
      .then(resultaat => {
        headerBron = resultaat.url;
        toonHeaderPreview(resultaat.url);
        toonMelding("Foto geüpload.", "ok");
      })
      .catch(error => {
        toonMelding("Uploaden is mislukt.", "fout");
        console.error(error);
      });
  });

  // ===== Body-blokken =====
  // Elk bloktype beschrijft zijn eigen velden. "lijst" velden zijn
  // herhaalbare rijen (bv. losse FAQ-vragen), "afbeelding" velden gebruiken
  // dezelfde mediabibliotheek als de header hierboven.
  const BLOK_TYPES = {
    intro_gecentreerd: {
      label: "Intro (gecentreerd)",
      velden: [
        { naam: "eyebrow", label: "Eyebrow", type: "tekst" },
        { naam: "kop", label: "Kop", type: "tekst" },
        { naam: "tekst", label: "Tekst", type: "tekstblok" }
      ]
    },
    intro_split: {
      label: "Intro (split)",
      velden: [
        { naam: "tekst", label: "Tekst", type: "tekstblok" },
        { naam: "uitgelicht", label: "Uitgelichte quote/stat", type: "tekst" }
      ]
    },
    tekst: {
      label: "Tekst",
      velden: [{ naam: "inhoud", label: "Inhoud", type: "tekstblok" }]
    },
    tekst_kolommen: {
      label: "Tekst in kolommen",
      velden: [
        { naam: "kolom1", label: "Kolom 1", type: "tekstblok" },
        { naam: "kolom2", label: "Kolom 2", type: "tekstblok" }
      ]
    },
    uitgelichte_quote: {
      label: "Uitgelichte quote",
      velden: [{ naam: "quote", label: "Quote", type: "tekstblok" }]
    },
    afbeelding_tekst: {
      label: "Afbeelding + tekst",
      velden: [
        { naam: "afbeelding", label: "Afbeelding", type: "afbeelding" },
        { naam: "tekst", label: "Tekst", type: "tekstblok" },
        { naam: "richting", label: "Richting", type: "keuze", opties: ["links", "rechts"] }
      ]
    },
    bullet_lijst: {
      label: "Bullet-lijst",
      velden: [
        { naam: "titel", label: "Titel (optioneel)", type: "tekst" },
        {
          naam: "punten", label: "Punten", type: "lijst",
          subvelden: [
            { naam: "icoon", label: "Icoon (emoji)", type: "tekst" },
            { naam: "tekst", label: "Tekst", type: "tekst" }
          ]
        }
      ]
    },
    arbeidsvoorwaarden_grid: {
      label: "Arbeidsvoorwaarden-grid",
      velden: [
        {
          naam: "items", label: "Items", type: "lijst",
          subvelden: [
            { naam: "icoon", label: "Icoon (emoji)", type: "tekst" },
            { naam: "tekst", label: "Tekst", type: "tekst" }
          ]
        }
      ]
    },
    collega_quote: {
      label: "Collega-quote",
      velden: [
        { naam: "quote", label: "Quote", type: "tekstblok" },
        { naam: "naam", label: "Naam", type: "tekst" },
        { naam: "functie", label: "Functie (optioneel)", type: "tekst" },
        { naam: "foto", label: "Foto", type: "afbeelding" }
      ]
    },
    video_embed: {
      label: "Video",
      velden: [{ naam: "url", label: "Video-URL", type: "tekst" }]
    },
    team_voorstelling: {
      label: "Team-voorstelling",
      velden: [
        {
          naam: "leden", label: "Teamleden", type: "lijst",
          subvelden: [
            { naam: "voornaam", label: "Voornaam", type: "tekst" },
            { naam: "foto", label: "Foto", type: "afbeelding" }
          ]
        }
      ]
    },
    sollicitatieproces: {
      label: "Sollicitatieproces",
      velden: [
        {
          naam: "stappen", label: "Stappen", type: "lijst",
          subvelden: [
            { naam: "titel", label: "Titel", type: "tekst" },
            { naam: "omschrijving", label: "Omschrijving", type: "tekstblok" }
          ]
        }
      ]
    },
    veelgestelde_vragen: {
      label: "Veelgestelde vragen",
      velden: [
        {
          naam: "vragen", label: "Vragen", type: "lijst",
          subvelden: [
            { naam: "vraag", label: "Vraag", type: "tekst" },
            { naam: "antwoord", label: "Antwoord", type: "tekstblok" }
          ]
        }
      ]
    },
    sluitingsdatum_banner: {
      label: "Sluitingsdatum-banner",
      velden: []
    }
  };

  let bodyBlokken = [];

  const blokTypeSelect = document.getElementById("nieuw-blok-type");
  Object.entries(BLOK_TYPES).forEach(([type, definitie]) => {
    const optie = document.createElement("option");
    optie.value = type;
    optie.textContent = definitie.label;
    blokTypeSelect.appendChild(optie);
  });

  function nieuweBlokData(type) {
    const definitie = BLOK_TYPES[type];
    const data = { type };
    definitie.velden.forEach(veldDef => {
      data[veldDef.naam] = veldDef.type === "lijst" ? [] : "";
    });
    return data;
  }

  document.getElementById("blok-toevoegen-knop").addEventListener("click", () => {
    bodyBlokken.push(nieuweBlokData(blokTypeSelect.value));
    renderBlokken();
  });

  // Herbruikbare foto-kiezer: eigen upload + "bestaande kiezen" per
  // instantie, zodat meerdere afbeelding-velden (ook binnen lijst-items)
  // onafhankelijk van elkaar werken.
  function maakAfbeeldingKiezer(doel, veldNaam) {
    const wrapper = document.createElement("div");
    wrapper.className = "afbeelding-kiezer";

    const preview = document.createElement("img");
    preview.className = "afbeelding-kiezer-preview";
    if (doel[veldNaam]) {
      preview.src = doel[veldNaam];
    } else {
      preview.hidden = true;
    }
    wrapper.appendChild(preview);

    const rij = document.createElement("div");
    rij.className = "afbeelding-kiezer-rij";

    const uploadInput = document.createElement("input");
    uploadInput.type = "file";
    uploadInput.accept = ".jpg,.jpeg,.png,.webp,.gif";
    uploadInput.addEventListener("change", () => {
      const bestand = uploadInput.files[0];
      if (!bestand) return;
      fetch("/api/media?bestandsnaam=" + encodeURIComponent(bestand.name), {
        method: "POST",
        headers: { "Content-Type": "application/octet-stream" },
        body: bestand
      })
        .then(response => {
          if (!response.ok) throw new Error("Status: " + response.status);
          return response.json();
        })
        .then(resultaat => {
          doel[veldNaam] = resultaat.url;
          preview.src = resultaat.url;
          preview.hidden = false;
        })
        .catch(error => console.error(error));
    });
    rij.appendChild(uploadInput);

    const grid = document.createElement("div");
    grid.className = "media-grid";
    grid.hidden = true;

    const kiesKnop = document.createElement("button");
    kiesKnop.type = "button";
    kiesKnop.className = "btn btn-klein btn-secundair";
    kiesKnop.textContent = "Bestaande kiezen";
    kiesKnop.addEventListener("click", () => {
      if (!grid.hidden) {
        grid.hidden = true;
        return;
      }
      grid.hidden = false;
      grid.innerHTML = "<p>Bibliotheek laden...</p>";
      fetch("/api/media")
        .then(response => {
          if (!response.ok) throw new Error("Status: " + response.status);
          return response.json();
        })
        .then(bestanden => {
          grid.innerHTML = "";
          if (bestanden.length === 0) {
            grid.innerHTML = "<p>Nog geen foto's geüpload.</p>";
            return;
          }
          bestanden.forEach(bestand => {
            const knop = document.createElement("button");
            knop.type = "button";
            knop.title = bestand.naam;
            const img = document.createElement("img");
            img.src = bestand.url;
            img.alt = bestand.naam;
            knop.appendChild(img);
            knop.addEventListener("click", () => {
              doel[veldNaam] = bestand.url;
              preview.src = bestand.url;
              preview.hidden = false;
              grid.hidden = true;
            });
            grid.appendChild(knop);
          });
        })
        .catch(error => {
          grid.innerHTML = "<p>Kon de mediabibliotheek niet laden.</p>";
          console.error(error);
        });
    });
    rij.appendChild(kiesKnop);

    wrapper.appendChild(rij);
    wrapper.appendChild(grid);
    return wrapper;
  }

  function maakVeldRij(veldDef, doel) {
    const rij = document.createElement("div");
    rij.className = "veld-rij";

    const label = document.createElement("label");
    label.textContent = veldDef.label;
    rij.appendChild(label);

    if (veldDef.type === "lijst") {
      rij.appendChild(maakLijstVeld(veldDef, doel));
      return rij;
    }

    if (veldDef.type === "afbeelding") {
      rij.appendChild(maakAfbeeldingKiezer(doel, veldDef.naam));
      return rij;
    }

    let input;
    if (veldDef.type === "tekstblok") {
      input = document.createElement("textarea");
    } else if (veldDef.type === "keuze") {
      input = document.createElement("select");
      veldDef.opties.forEach(optie => {
        const optionEl = document.createElement("option");
        optionEl.value = optie;
        optionEl.textContent = optie;
        input.appendChild(optionEl);
      });
    } else {
      input = document.createElement("input");
      input.type = "text";
    }
    input.value = doel[veldDef.naam] || "";
    input.addEventListener("input", () => { doel[veldDef.naam] = input.value; });
    rij.appendChild(input);
    return rij;
  }

  function maakLijstVeld(veldDef, blok) {
    const wrapper = document.createElement("div");
    wrapper.className = "lijst-veld";

    const itemsContainer = document.createElement("div");
    itemsContainer.className = "lijst-items";

    function renderItems() {
      itemsContainer.innerHTML = "";
      blok[veldDef.naam].forEach((item, itemIndex) => {
        const itemEl = document.createElement("div");
        itemEl.className = "lijst-item";

        veldDef.subvelden.forEach(sub => {
          itemEl.appendChild(maakVeldRij(sub, item));
        });

        const verwijderKnop = document.createElement("button");
        verwijderKnop.type = "button";
        verwijderKnop.className = "btn btn-klein btn-gevaar";
        verwijderKnop.textContent = "Verwijderen";
        verwijderKnop.addEventListener("click", () => {
          blok[veldDef.naam].splice(itemIndex, 1);
          renderItems();
        });
        itemEl.appendChild(verwijderKnop);

        itemsContainer.appendChild(itemEl);
      });
    }
    renderItems();
    wrapper.appendChild(itemsContainer);

    const toevoegenKnop = document.createElement("button");
    toevoegenKnop.type = "button";
    toevoegenKnop.className = "btn btn-klein btn-secundair";
    toevoegenKnop.textContent = "+ Toevoegen";
    toevoegenKnop.addEventListener("click", () => {
      const nieuwItem = {};
      veldDef.subvelden.forEach(sub => { nieuwItem[sub.naam] = ""; });
      blok[veldDef.naam].push(nieuwItem);
      renderItems();
    });
    wrapper.appendChild(toevoegenKnop);

    return wrapper;
  }

  function maakBlokKaart(blok, index) {
    const definitie = BLOK_TYPES[blok.type];
    const kaart = document.createElement("div");
    kaart.className = "blok-kaart";

    const header = document.createElement("div");
    header.className = "blok-kaart-header";

    const label = document.createElement("span");
    label.className = "blok-label";
    label.textContent = `${index + 1}. ${definitie.label}`;
    header.appendChild(label);

    const acties = document.createElement("div");
    acties.className = "blok-acties";

    const omhoogKnop = document.createElement("button");
    omhoogKnop.type = "button";
    omhoogKnop.textContent = "↑";
    omhoogKnop.disabled = index === 0;
    omhoogKnop.addEventListener("click", () => {
      [bodyBlokken[index - 1], bodyBlokken[index]] = [bodyBlokken[index], bodyBlokken[index - 1]];
      renderBlokken();
    });
    acties.appendChild(omhoogKnop);

    const omlaagKnop = document.createElement("button");
    omlaagKnop.type = "button";
    omlaagKnop.textContent = "↓";
    omlaagKnop.disabled = index === bodyBlokken.length - 1;
    omlaagKnop.addEventListener("click", () => {
      [bodyBlokken[index + 1], bodyBlokken[index]] = [bodyBlokken[index], bodyBlokken[index + 1]];
      renderBlokken();
    });
    acties.appendChild(omlaagKnop);

    const verwijderKnop = document.createElement("button");
    verwijderKnop.type = "button";
    verwijderKnop.className = "btn-verwijder-blok";
    verwijderKnop.textContent = "Verwijderen";
    verwijderKnop.addEventListener("click", () => {
      bodyBlokken.splice(index, 1);
      renderBlokken();
    });
    acties.appendChild(verwijderKnop);

    header.appendChild(acties);
    kaart.appendChild(header);

    if (definitie.velden.length === 0) {
      const leeg = document.createElement("p");
      leeg.className = "blok-geen-velden";
      leeg.textContent = "Geen instellingen nodig, toont automatisch de resterende tijd tot de sluitingsdatum.";
      kaart.appendChild(leeg);
    } else {
      const velden = document.createElement("div");
      velden.className = "blok-velden";
      definitie.velden.forEach(veldDef => {
        velden.appendChild(maakVeldRij(veldDef, blok));
      });
      kaart.appendChild(velden);
    }

    return kaart;
  }

  function renderBlokken() {
    const container = document.getElementById("blokken-container");
    container.innerHTML = "";
    if (bodyBlokken.length === 0) {
      container.innerHTML = "<p class=\"blokken-leeg\">Nog geen blokken toegevoegd.</p>";
      return;
    }
    bodyBlokken.forEach((blok, index) => container.appendChild(maakBlokKaart(blok, index)));
  }

  renderBlokken();

  // ===== Bestaande vacature laden (bewerken) =====
  if (vacatureId) {
    document.getElementById("pagina-titel").textContent = "Vacature bewerken";
    document.getElementById("verwijder-knop").hidden = false;

    fetch("/api/vacatures/" + encodeURIComponent(vacatureId))
      .then(response => {
        if (!response.ok) throw new Error("Status: " + response.status);
        return response.json();
      })
      .then(vacature => {
        document.getElementById("veld-titel").value = vacature.titel || "";
        document.getElementById("veld-afdeling").value = vacature.afdeling || "";
        document.getElementById("veld-locatie").value = vacature.locatie || "";
        document.getElementById("veld-dienstverband").value = vacature.dienstverband || "";
        document.getElementById("veld-opleidingsniveau").value = vacature.opleidingsniveau || "";
        document.getElementById("veld-salaris-overleg").checked = Boolean(vacature.salarisInOverleg);
        document.getElementById("veld-salaris-min").value = vacature.salarisMin ?? "";
        document.getElementById("veld-salaris-max").value = vacature.salarisMax ?? "";
        document.getElementById("veld-salaris-min").disabled = Boolean(vacature.salarisInOverleg);
        document.getElementById("veld-salaris-max").disabled = Boolean(vacature.salarisInOverleg);
        document.getElementById("veld-publicatiedatum").value = (vacature.publicatiedatum || "").slice(0, 10);
        document.getElementById("veld-sluitingsdatum").value = (vacature.sluitingsdatum || "").slice(0, 10);
        document.getElementById("veld-status").value = vacature.status || "concept";

        if (vacature.header && vacature.header.type === "video") {
          stelHeaderTypeIn("video");
          document.getElementById("veld-video-url").value = vacature.header.bron || "";
        } else if (vacature.header) {
          stelHeaderTypeIn("foto");
          headerBron = vacature.header.bron || "";
          toonHeaderPreview(headerBron);
        }

        bodyBlokken = Array.isArray(vacature.bodyBlokken) ? vacature.bodyBlokken : [];
        renderBlokken();
      })
      .catch(error => {
        toonMelding("Kon de vacature niet laden.", "fout");
        console.error(error);
      });
  }

  document.getElementById("verwijder-knop").addEventListener("click", () => {
    if (!confirm("Deze vacature definitief verwijderen?")) return;
    fetch("/api/vacatures/" + encodeURIComponent(vacatureId), { method: "DELETE" })
      .then(response => {
        if (!response.ok && response.status !== 204) throw new Error("Status: " + response.status);
        location.href = "/beheer/index.html";
      })
      .catch(error => {
        toonMelding("Verwijderen is mislukt.", "fout");
        console.error(error);
      });
  });

  function parseOptioneelGetal(waarde) {
    return waarde === "" ? null : Number(waarde);
  }

  // ===== Opslaan =====
  document.getElementById("vacature-form").addEventListener("submit", event => {
    event.preventDefault();

    const isVideo = document.getElementById("header-type-video").checked;
    const header = isVideo
      ? { type: "video", bron: document.getElementById("veld-video-url").value }
      : { type: "foto", bron: headerBron };

    const salarisInOverleg = document.getElementById("veld-salaris-overleg").checked;

    const vacature = {
      titel: document.getElementById("veld-titel").value,
      afdeling: document.getElementById("veld-afdeling").value,
      locatie: document.getElementById("veld-locatie").value,
      dienstverband: document.getElementById("veld-dienstverband").value,
      opleidingsniveau: document.getElementById("veld-opleidingsniveau").value,
      salarisInOverleg,
      salarisMin: salarisInOverleg ? null : parseOptioneelGetal(document.getElementById("veld-salaris-min").value),
      salarisMax: salarisInOverleg ? null : parseOptioneelGetal(document.getElementById("veld-salaris-max").value),
      publicatiedatum: document.getElementById("veld-publicatiedatum").value || null,
      sluitingsdatum: document.getElementById("veld-sluitingsdatum").value || null,
      status: document.getElementById("veld-status").value,
      header,
      bodyBlokken
    };

    const opslaanKnop = document.getElementById("opslaan-knop");
    opslaanKnop.disabled = true;
    toonMelding("", "ok");

    const request = vacatureId
      ? fetch("/api/vacatures/" + encodeURIComponent(vacatureId), {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(vacature)
        })
      : fetch("/api/vacatures", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(vacature)
        });

    request
      .then(response => {
        if (!response.ok) throw new Error("Status: " + response.status);
        return response.json();
      })
      .then(() => {
        location.href = "/beheer/index.html";
      })
      .catch(error => {
        toonMelding("Opslaan is mislukt.", "fout");
        opslaanKnop.disabled = false;
        console.error(error);
      });
  });
</script>

</body>
</html>
