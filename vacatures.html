<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacatures | Werken bij OG Clean Fuels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <a href="index.html" class="logo">OG Clean Fuels</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="vacatures.html" class="active">Vacatures</a>
    <a href="over-ons.html">Over ons</a>
  </nav>
</header>

<section class="content">
  <div class="section-head">
    <span class="tag">Openstaande functies</span>
    <h2>Onze vacatures</h2>
  </div>

  <div class="card-grid" id="vacature-lijst">
    <p id="laad-status">Vacatures laden...</p>
  </div>
</section>

<footer>
  <span class="logo-footer">OG Clean Fuels</span>
  <p>&copy; 2026 OG Clean Fuels. Alle rechten voorbehouden.</p>
</footer>

<script>
  const VACATURE_BRON = "/api/GetVacatures";

  // Zelfde slug-logica als in het generatie script, zodat de link hier
  // exact overeenkomt met de bestandsnaam die gegenereerd is.
  function maakSlug(tekst) {
    return (tekst || "")
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/&/g, " en ")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }

  // Haalt platte tekst uit de rich-text omschrijving (die bevat HTML
  // van SharePoint) en knipt hem af op 100 tekens voor de tegel.
  function maakSamenvatting(html, lengte = 100) {
    const tijdelijk = document.createElement("div");
    tijdelijk.innerHTML = html || "";
    const platteTekst = tijdelijk.textContent || tijdelijk.innerText || "";
    const opgeschoond = platteTekst.replace(/\s+/g, " ").trim();
    return opgeschoond.length > lengte
      ? opgeschoond.slice(0, lengte).trim() + "..."
      : opgeschoond;
  }

  fetch(VACATURE_BRON)
    .then(response => {
      if (!response.ok) throw new Error("Status: " + response.status);
      return response.json();
    })
    .then(vacatures => {
      const container = document.getElementById("vacature-lijst");
      container.innerHTML = "";

      const actieveVacatures = vacatures.filter(v => v.actief);

      if (actieveVacatures.length === 0) {
        container.innerHTML = "<p>Er staan op dit moment geen vacatures open.</p>";
        return;
      }

      actieveVacatures.forEach(vacature => {
        const kaart = document.createElement("a");
        kaart.className = "vacature-card";
        kaart.href = `/vacature/${maakSlug(vacature.titel)}.html`;
        kaart.style.textDecoration = "none";
        kaart.style.color = "inherit";
        kaart.innerHTML = `
          <div class="afdeling">${vacature.afdeling || ""}</div>
          <h3>${vacature.titel || ""}</h3>
          <div class="meta-row">
            <span class="meta-pill">${vacature.dienstverband || ""}</span>
            <span class="meta-pill">${vacature.land || ""}</span>
          </div>
          <p class="omschrijving">${maakSamenvatting(vacature.omschrijving, 100)}</p>
          <span class="btn">Lees meer &amp; solliciteer</span>
        `;
        container.appendChild(kaart);
      });
    })
    .catch(error => {
      document.getElementById("vacature-lijst").innerHTML =
        "<p>Er ging iets mis bij het laden van de vacatures. Probeer het later opnieuw.</p>";
      console.error(error);
    });
</script>

</body>
</html>
