<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacatures | Werken bij OG Clean Fuels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <a href="index.html" class="logo">OG Clean Fuels</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="vacatures.html" class="active">Vacatures</a>
    <a href="over-ons.html">Over ons</a>
  </nav>
</header>

<section class="content">
  <div class="section-head">
    <span class="tag">Openstaande functies</span>
    <h2>Onze vacatures</h2>
  </div>

  <div class="card-grid" id="vacature-lijst">
    <p id="laad-status">Vacatures laden...</p>
  </div>
</section>

<footer>
  <span class="logo-footer">OG Clean Fuels</span>
  <p>&copy; 2026 OG Clean Fuels. Alle rechten voorbehouden.</p>
</footer>

<script>
  // Dit haalt nu vacatures.json op, dat lokaal bij de site staat.
  // Straks vervang je alleen deze URL door de Azure Function URL,
  // de rest van deze code blijft ongewijzigd.
  const VACATURE_BRON = "vacatures.json";

  fetch(VACATURE_BRON)
    .then(response => {
      if (!response.ok) {
        throw new Error("Kon vacatures niet ophalen, status: " + response.status);
      }
      return response.json();
    })
    .then(vacatures => {
      const container = document.getElementById("vacature-lijst");
      container.innerHTML = ""; // "Vacatures laden..." tekst weghalen

      const actieveVacatures = vacatures.filter(v => v.actief);

      if (actieveVacatures.length === 0) {
        container.innerHTML = "<p>Er staan op dit moment geen vacatures open.</p>";
        return;
      }

      actieveVacatures.forEach(vacature => {
        const kaart = document.createElement("div");
        kaart.className = "vacature-card";
        kaart.innerHTML = `
          <div class="afdeling">${vacature.afdeling}</div>
          <h3>${vacature.titel}</h3>
          <div class="meta-row">
            <span class="meta-pill">${vacature.dienstverband}</span>
            <span class="meta-pill">${vacature.standplaats}</span>
          </div>
          <p class="omschrijving">${vacature.omschrijving}</p>
          <p class="salaris">${vacature.salarisindicatie}</p>
          <a href="#" class="btn">Lees meer &amp; solliciteer</a>
        `;
        container.appendChild(kaart);
      });
    })
    .catch(error => {
      const container = document.getElementById("vacature-lijst");
      container.innerHTML = "<p>Er ging iets mis bij het laden van de vacatures. Probeer het later opnieuw.</p>";
      console.error(error);
    });
</script>

</body>
</html>
