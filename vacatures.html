<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacatures | Werken bij OG Clean Fuels</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <a href="index.html" class="logo" aria-label="OG Clean Fuels, naar de homepage">
    <span class="logo-afbeelding-wrap">
      <img class="logo-afbeelding logo-afbeelding-wit" src="images/logo/og-logo-wit.png" alt="">
      <img class="logo-afbeelding logo-afbeelding-kleur" src="images/logo/og-logo-kleur.png" alt="OG Clean Fuels">
    </span>
  </a>
  <nav>
    <a href="index.html">Home</a>
    <a href="vacatures.html" class="active">Vacatures</a>
    <a href="over-ons.html">Over ons</a>
  </nav>
</header>

<section class="content">
  <div class="section-head reveal">
    <span class="tag">Openstaande functies</span>
    <h2>Onze <span class="titel-highlight">vacatures</span></h2>
  </div>

  <div class="card-grid reveal" id="vacature-lijst">
    <p id="laad-status">Vacatures laden...</p>
  </div>
</section>

<footer>
  <span class="logo-footer">OG Clean Fuels</span>
  <p>&copy; 2026 OG Clean Fuels. Alle rechten voorbehouden.</p>
</footer>

<script src="animations.js"></script>
<script>
  const VACATURE_BRON = "/api/GetVacatures";

  // Zelfde slug-logica als in het generatie script, zodat de link hier
  // exact overeenkomt met de bestandsnaam die gegenereerd is.
  function maakSlug(tekst) {
    return (tekst || "")
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/&/g, " en ")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }

  // Zoekt het eerste tekstuele body-blok op (intro of gewone tekst) en
  // knipt dat af op 100 tekens voor de tegel. Body-blokken bevatten
  // platte tekst (geen HTML), dus geen strip-stap meer nodig.
  function maakSamenvatting(bodyBlokken, lengte = 100) {
    const blok = (bodyBlokken || []).find(b => ["intro_gecentreerd", "intro_split", "tekst"].includes(b.type));
    const ruweTekst = (blok && (blok.tekst || blok.inhoud) || "").replace(/\s+/g, " ").trim();
    return ruweTekst.length > lengte ? ruweTekst.slice(0, lengte).trim() + "..." : ruweTekst;
  }

  fetch(VACATURE_BRON)
    .then(response => {
      if (!response.ok) throw new Error("Status: " + response.status);
      return response.json();
    })
    .then(vacatures => {
      const container = document.getElementById("vacature-lijst");
      container.innerHTML = "";

      if (vacatures.length === 0) {
        container.innerHTML = "<p>Er staan op dit moment geen vacatures open.</p>";
        return;
      }

      vacatures.forEach(vacature => {
        const kaart = document.createElement("a");
        kaart.className = "vacature-card";
        kaart.href = `/vacature/${maakSlug(vacature.titel)}.html`;
        kaart.style.textDecoration = "none";
        kaart.style.color = "inherit";
        kaart.innerHTML = `
          <div class="afdeling">${vacature.afdeling || ""}</div>
          <h3>${vacature.titel || ""}</h3>
          <div class="meta-row">
            <span class="meta-pill">${vacature.dienstverband || ""}</span>
            <span class="meta-pill">${vacature.locatie || ""}</span>
          </div>
          <p class="omschrijving">${maakSamenvatting(vacature.bodyBlokken, 100)}</p>
          <span class="btn">Lees meer &amp; solliciteer</span>
        `;
        container.appendChild(kaart);
      });
    })
    .catch(error => {
      document.getElementById("vacature-lijst").innerHTML =
        "<p>Er ging iets mis bij het laden van de vacatures. Probeer het later opnieuw.</p>";
      console.error(error);
    });
</script>

</body>
</html>
